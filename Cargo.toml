[package]
name = "herdr-marks"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Letter marks for Herdr panes and workspaces, visible in the sidebar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mcostasilva/herdr-marks"
keywords = ["herdr", "terminal", "marks", "navigation"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
